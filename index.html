<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Notes</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --card:#fff; --line:#d0d7de; --fg:#1f2328; --muted:#656d76; --accent:#0969da; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  a.card { display:block; padding:16px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  .t { font-weight:600; color:var(--accent); }
  .d { color:var(--muted); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>Thinking Notes</h1>
  <p class="sub">各議題目錄。新增議題：建立子資料夾，並在下方 <code>ul</code> 加一個項目。</p>
  <ul>
    <li><a class="card" href="./learning-map/">
      <div class="t">Learning Map</div>
      <div class="d">MAC Valves 消音器自動組裝機 (RPM005) 學習地圖</div>
    </a></li>
  </ul>
</main>
</body>
</html>
